[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capyagent"
version = "0.0.1"
description = "CapyAgent: личный ИИ-агент на вашем компьютере. Пакет в разработке, установка на capyagent.ru."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Kirill Smolnikov" }]
keywords = ["capyagent", "agent", "telegram", "assistant"]

[project.urls]
Homepage = "https://capyagent.ru"
